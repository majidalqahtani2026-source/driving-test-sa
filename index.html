<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار القيادة النظري — السعودية</title>
<style>
  :root { --green:#1e7d3c; --blue:#14508c; --bg:#f4f6f8; }
  * { box-sizing:border-box; font-family:'Segoe UI', Tahoma, Arial, sans-serif; }
  body { margin:0; background:var(--bg); color:#1a1a1a; }
  header { background:linear-gradient(135deg,#14508c,#1e7d3c); color:#fff; padding:18px 16px; text-align:center; }
  header h1 { margin:0; font-size:1.25rem; }
  header p { margin:6px 0 0; font-size:.85rem; opacity:.9; }
  .wrap { max-width:680px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:14px; padding:20px; margin:14px 0; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .btn { display:inline-block; background:var(--green); color:#fff; border:none; border-radius:10px; padding:14px 22px; font-size:1.05rem; cursor:pointer; width:100%; margin-top:8px; }
  .btn.secondary { background:var(--blue); }
  .btn:disabled { background:#9bb8a5; }
  .exam-grid { display:grid; gap:12px; }
  .exam-card { background:#fff; border:2px solid #e1e6ea; border-radius:14px; padding:18px; cursor:pointer; transition:.15s; }
  .exam-card:active { transform:scale(.98); }
  .exam-card h3 { margin:0 0 6px; color:var(--blue); }
  .exam-card small { color:#667; }
  .meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; font-size:.9rem; color:#556; flex-wrap:wrap; gap:8px; }
  .timer { font-weight:bold; color:var(--blue); background:#e8f0fa; padding:4px 12px; border-radius:8px; }
  .progress { height:8px; background:#e1e6ea; border-radius:4px; overflow:hidden; margin-bottom:16px; }
  .progress > div { height:100%; background:var(--green); width:0; transition:.3s; }
  .qtext { font-size:1.1rem; font-weight:600; line-height:1.7; margin:0 0 16px; }
  .sign-img { max-width:150px; display:block; margin:0 auto 14px; }
  .opt { display:block; width:100%; text-align:right; background:#f8fafb; border:2px solid #dde4e9; border-radius:12px; padding:14px 16px; margin:10px 0; font-size:1rem; cursor:pointer; transition:.15s; line-height:1.6; }
  .opt:hover { border-color:var(--blue); }
  .opt.correct { background:#e3f6e8; border-color:var(--green); }
  .opt.wrong { background:#fdeaea; border-color:#c62828; }
  .opt:disabled { cursor:default; }
  .feedback { padding:12px 16px; border-radius:10px; margin-top:12px; font-size:.95rem; line-height:1.7; }
  .feedback.ok { background:#e3f6e8; color:var(--green); }
  .feedback.no { background:#fdeaea; color:#c62828; }
  .score-big { font-size:3rem; font-weight:800; text-align:center; color:var(--blue); margin:10px 0; }
  .pass { color:var(--green); } .fail { color:#c62828; }
  .result-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:.95rem; }
  .review-q { border-top:1px dashed #ccd; padding-top:12px; margin-top:12px; font-size:.92rem; }
  .review-q b.bad { color:#c62828; }
  .hidden { display:none; }
  footer { text-align:center; font-size:.75rem; color:#889; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>🚗 اختبار القيادة النظري — السعودية</h1>
  <p>٥ اختبارات محاكية • أسئلة مرتبة عشوائيًا في كل محاولة</p>
</header>
<div class="wrap" id="app"></div>
<footer>للتدريب فقط — الاختبار الرسمي عبر أبشر/مدرسة القيادة</footer>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
